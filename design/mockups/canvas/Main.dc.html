<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aegis Terra · Live map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#080E1A}
a{color:#52B6FF;text-decoration:none}a:hover{color:#8FD0FF}
@keyframes at-pulse{0%{transform:translate(-50%,-50%) scale(1);opacity:.55}100%{transform:translate(-50%,-50%) scale(2.2);opacity:0}}
.at-halo{animation:at-pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion: reduce){.at-halo{animation:none;opacity:.35;transform:translate(-50%,-50%) scale(1.6)}}
.at-chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #060B15; color: #E8EEF6; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <!-- Map -->
  <img src="/_blob/2dbdd4b7f3e26d3844dbb6145ff6e6d4" alt="" style="position: absolute; left: -396.7px; top: 50px; width: 1500px; height: 600px; max-width: none">
  <svg aria-hidden="true" width="390" height="844" style="position: absolute; left: 0; top: 0">
    <circle cx="95" cy="331" r="24" fill="#F35D62" fill-opacity="0.18" stroke="#F35D62" stroke-width="1.5"></circle>
    <path d="M95 319 L8 262 L-10 300 L95 343 Z" fill="none" stroke="#F35D62" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.9"></path>
    <path d="M95 331 L40 305 L-6 282" fill="none" stroke="#F35D62" stroke-width="1.2" stroke-dasharray="2 4" stroke-opacity="0.8"></path>
    <ellipse cx="173" cy="495" rx="20" ry="12" fill="#FFB54A" fill-opacity="0.18" stroke="#FFB54A" stroke-width="1.5"></ellipse>
  </svg>

  <!-- Clusters -->
  <sc-for list="{{clusters}}" as="c" hint-placeholder-count="2">
    <button aria-label="{{c.aria}}" style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; transform: translate(-50%,-50%); width: 38px; height: 38px; border-radius: 50%; background: #111C2D; border: 2px solid {{c.color}}; color: #E8EEF6; font: 600 14px/1 -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; box-shadow: 0 1px 3px rgba(0,0,0,.5); padding: 0; cursor: pointer">{{c.count}}</button>
  </sc-for>

  <!-- Markers -->
  <sc-for list="{{markers}}" as="m" hint-placeholder-count="5">
    <div style="position: absolute; left: {{m.x}}px; top: {{m.y}}px; width: 0; height: 0">
      <div class="{{m.haloClass}}" style="position: absolute; left: 0; top: 0; width: {{m.l3}}px; height: {{m.l3}}px; transform: translate(-50%,-50%); border-radius: 50%; border: 2px solid {{m.color}}; opacity: {{m.haloOpacity}}"></div>
      <div style="position: absolute; left: 0; top: 0; width: {{m.l1}}px; height: {{m.l1}}px; transform: translate(-50%,-50%); background: {{m.c1}}; clip-path: {{m.clip}}"></div>
      <div style="position: absolute; left: 0; top: 0; width: {{m.l2}}px; height: {{m.l2}}px; transform: translate(-50%,-50%); background: {{m.c2}}; clip-path: {{m.clip}}"></div>
      <div style="position: absolute; left: 0; top: 0; width: {{m.l3}}px; height: {{m.l3}}px; transform: translate(-50%,-50%); background: {{m.c3}}; clip-path: {{m.clip}}"></div>
      <img src="{{m.icon}}" alt="{{m.aria}}" style="position: absolute; left: 0; top: {{m.iconDy}}px; width: {{m.glyph}}px; height: {{m.glyph}}px; transform: translate(-50%,-50%)">
    </div>
  </sc-for>

  <!-- Status capsule -->
  <div style="position: absolute; left: 16px; top: 54px; height: 36px; padding: 0 12px 0 8px; display: flex; align-items: center; gap: 8px; border-radius: 18px; background: rgba(17,28,45,0.78); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border: 1px solid rgba(232,238,246,0.08)">
    <img src="/_blob/3de165abf46116ce45ba402127a17db1" alt="Aegis Terra" style="width: 22px; height: 24px; object-fit: contain">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.9px; color: #E8EEF6">AEGIS TERRA</span>
    <span style="width: 1px; height: 14px; background: #24324A"></span>
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #4FD1A1"></span>
    <span style="font-size: 12px; color: #9AABC2; font-variant-numeric: tabular-nums">Live · 30 s ago</span>
  </div>

  <!-- Map controls -->
  <div style="position: absolute; right: 16px; top: 54px; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: rgba(17,28,45,0.78); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(232,238,246,0.08)">
    <button aria-label="Layers" style="width: 44px; height: 44px; border: 0; background: transparent; color: #E8EEF6; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8EEF6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7l10-5Z"></path><path d="m2 12 10 5 10-5"></path><path d="m2 17 10 5 10-5"></path></svg>
    </button>
    <div style="height: 1px; background: #24324A"></div>
    <button aria-label="Locate me" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#52B6FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 22 2l-9 19-2-8-8-2Z"></path></svg>
    </button>
    <div style="height: 1px; background: #24324A"></div>
    <button aria-label="Fit world" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
      <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E8EEF6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"></path></svg>
    </button>
  </div>

  <!-- Filter chips -->
  <div class="at-chips" style="position: absolute; left: 0; top: 100px; width: 320px; padding-left: 16px; display: flex; gap: 8px; overflow-x: auto; box-sizing: border-box">
    <sc-for list="{{chips}}" as="ch" hint-placeholder-count="4">
      <button style="flex: 0 0 auto; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid {{ch.border}}; background: {{ch.bg}}; color: {{ch.fg}}; font: 500 13px/1 -apple-system, system-ui, sans-serif; display: flex; align-items: center; gap: 6px; cursor: pointer">{{ch.label}}<span aria-hidden="true" style="color: #6F819A; font-size: 10px">▾</span></button>
    </sc-for>
  </div>

  <!-- New-event toast -->
  <sc-if value="{{showToast}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 16px; top: 144px; width: 302px; box-sizing: border-box; padding: 10px 8px 10px 12px; display: flex; align-items: center; gap: 10px; border-radius: 12px; background: rgba(17,28,45,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(232,238,246,0.08); box-shadow: 0 8px 24px rgba(0,0,0,.35)">
      <div style="width: 22px; height: 22px; flex: 0 0 auto; background: #FF8540; clip-path: polygon(50% 6%,100% 94%,0 94%)"></div>
      <a href="EventDetail.dc.html" style="flex: 1; min-width: 0; color: #E8EEF6; font-size: 13px; line-height: 1.3">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.9px; color: #9AABC2">NEW · </span>Severe earthquake · M6.1 · Chile
      </a>
      <button aria-label="Dismiss" onClick="{{dismissToast}}" style="width: 32px; height: 32px; border: 0; background: transparent; color: #9AABC2; font-size: 16px; cursor: pointer; padding: 0">✕</button>
    </div>
  </sc-if>

  <!-- Bottom sheet -->
  <div style="position: absolute; left: 0; top: {{sheetTop}}px; width: 390px; height: 844px; box-sizing: border-box; padding: 0 16px; background: rgba(17,28,45,0.96); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid rgba(232,238,246,0.10); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.35); transition: top 0.35s cubic-bezier(.2,.9,.25,1)">
    <button aria-label="{{detentLabel}}" onClick="{{toggleDetent}}" style="display: block; width: 100%; height: 22px; border: 0; background: transparent; cursor: pointer; padding: 0">
      <span style="display: block; width: 36px; height: 5px; margin: 0 auto; border-radius: 3px; background: #3A4A63"></span>
    </button>

    <div style="display: flex; gap: 8px; align-items: center">
      <label style="flex: 1; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; background: #203550">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AABC2" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input placeholder="Search places, countries, events" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #E8EEF6; font: 400 15px -apple-system, system-ui, sans-serif">
      </label>
      <a href="Saved.dc.html" aria-label="Saved regions" style="width: 40px; height: 40px; border-radius: 10px; background: #203550; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EEF6" stroke-width="1.8" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"></path></svg>
      </a>
      <a href="Alerts.dc.html" aria-label="Alerts" style="width: 40px; height: 40px; border-radius: 10px; background: #203550; display: flex; align-items: center; justify-content: center; position: relative">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EEF6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: #52B6FF"></span>
      </a>
    </div>

    <!-- Stat strip -->
    <div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.9px; color: #9AABC2">EARTH / MONITOR · WORLDWIDE</span>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: #FFB54A; border: 1px solid rgba(255,181,74,0.45); border-radius: 4px; padding: 2px 5px">SAMPLE DATA</span>
    </div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <button style="text-align: left; padding: 10px 10px 9px; border-radius: 12px; background: #0D1626; border: 1px solid #24324A; color: #E8EEF6; cursor: pointer">
          <span style="display: block; font-size: 24px; font-weight: 600; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; color: {{s.color}}">{{s.value}}</span>
          <span style="display: block; margin-top: 2px; font-size: 12px; color: #9AABC2">{{s.label}}</span>
        </button>
      </sc-for>
    </div>

    <!-- List -->
    <div style="margin-top: 16px; display: flex; align-items: baseline; justify-content: space-between">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.9px; color: #9AABC2">IN VIEW · BY SEVERITY</span>
      <span style="font-size: 12px; color: #6F819A; font-variant-numeric: tabular-nums">14 events</span>
    </div>
    <div style="margin-top: 4px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <a href="EventDetail.dc.html" aria-label="{{r.aria}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #1B2840; color: #E8EEF6; opacity: {{r.opacity}}">
          <div style="position: relative; width: 36px; height: 36px; flex: 0 0 auto">
            <div style="position: absolute; inset: 0; background: {{r.c1}}; clip-path: {{r.clip}}"></div>
            <div style="position: absolute; inset: {{r.inset}}px; background: {{r.c2}}; clip-path: {{r.clip}}"></div>
            <img src="{{r.icon}}" alt="" style="position: absolute; left: 50%; top: {{r.iconTop}}%; width: 17px; height: 17px; transform: translate(-50%,-50%)">
          </div>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</div>
            <div style="margin-top: 3px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AABC2; white-space: nowrap">
              <span style="padding: 1px 6px; border-radius: 5px; border: 1px {{r.kindBorder}} #3A4A63; color: #C3CEDD; font-size: 11px">{{r.kind}}</span>
              <span style="overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; color: {{r.freshColor}}">{{r.meta}}</span>
            </div>
          </div>
          <div style="text-align: right; flex: 0 0 auto">
            <div style="font-size: 13px; font-weight: 600; color: {{r.color}}">{{r.sev}}</div>
            <div style="margin-top: 2px; font-size: 11px; color: #9AABC2">{{r.srcSev}}</div>
          </div>
        </a>
      </sc-for>
    </div>
    <p style="margin: 12px 0 0; font-size: 11px; line-height: 1.4; color: #6F819A">Aegis Terra does not replace your national emergency service. Always follow official instructions.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { detent: 'medium', toast: true };
  }
  renderVals() {
    var SEV = {
      minor:    { c: '#8DA2BE', clip: 'circle(50% at 50% 50%)', k: 0.8, word: 'Minor', dy: 0 },
      moderate: { c: '#FFB54A', clip: 'polygon(50% 0,100% 50%,50% 100%,0 50%)', k: 1.0, word: 'Moderate', dy: 0 },
      severe:   { c: '#FF8540', clip: 'polygon(50% 4%,100% 94%,0 94%)', k: 1.15, word: 'Severe', dy: 3 },
      extreme:  { c: '#F35D62', clip: 'polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)', k: 1.3, word: 'Extreme', dy: 0 }
    };
    var ICON = {
      earthquake: ['/_blob/7e6eac9af5248001cff5976ebe1c7c17', '/_blob/d313e1881cb4c526f8f3ce3b42ee2c31'],
      wildfire: ['/_blob/82551be4f9d7ca315bac6d33e5c5bbb9', '/_blob/6ed402466eb7a2975a3fdfff7d2ed6ed'],
      flood: ['/_blob/2439b7ebe4a07c638949e7b03da867db', '/_blob/2796d6520e4d10b3d6566a6847297fa9'],
      tropical_cyclone: ['/_blob/8f8c9bbb178422f9a4e88790bc8384ec', '/_blob/5c31b08ad80b26103b7892acf210a104'],
      volcano: ['/_blob/3c2587dc198090837211c6701c00a7fb', '/_blob/f97b6e85ed151e83b563963a0736577d']
    };
    var CANVAS = '#080E1A';
    var events = [
      { type: 'tropical_cyclone', sev: 'extreme', kind: 'observed', x: 95, y: 331, title: 'Tropical cyclone near Lesser Antilles', meta: 'GDACS · 6 min ago', src: 'GDACS Red' },
      { type: 'earthquake', sev: 'severe', kind: 'observed', x: 55, y: 526, title: 'M6.1 earthquake off Coquimbo, Chile', meta: 'USGS · 12 min ago', src: 'PAGER yellow' },
      { type: 'flood', sev: 'moderate', kind: 'observed', x: 173, y: 495, title: 'Flooding, Rio de Janeiro state', meta: 'GDACS · 1 h ago', src: 'GDACS Green' },
      { type: 'earthquake', sev: 'minor', kind: 'observed', x: 232, y: 337, title: 'M4.6 earthquake, Mid-Atlantic Ridge', meta: 'USGS · 1 h ago', src: 'M4.6' },
      { type: 'volcano', sev: 'minor', kind: 'observed', x: 260, y: 134, title: 'Volcanic activity, Reykjanes, Iceland', meta: 'Stale · last update 3 h ago', src: 'Source: no level', stale: true },
      { type: 'tropical_cyclone', sev: 'moderate', kind: 'forecast', x: 128, y: 214, title: 'Storm forecast, Atlantic', meta: 'GDACS · 2 h ago', src: 'GDACS Orange', hideRow: true }
    ];
    var markers = events.map(function (e) {
      var s = SEV[e.sev];
      var base = Math.round(26 * s.k);
      var m = { x: e.x, y: e.y, clip: s.clip, color: s.c, aria: s.word + ' ' + e.type.replace('_', ' ') + ', ' + e.kind + ', ' + e.meta,
        haloClass: e.sev === 'extreme' ? 'at-halo' : '', haloOpacity: e.sev === 'extreme' ? 1 : 0, l3: base, glyph: Math.round(base * 0.5), iconDy: s.dy };
      if (e.kind === 'forecast') {
        m.l1 = 0; m.c1 = 'transparent'; m.l2 = base; m.c2 = s.c; m.c3 = CANVAS; m.l3 = base - 5; m.icon = ICON[e.type][1];
      } else {
        m.l1 = e.kind === 'warning' ? base + 9 : 0; m.c1 = s.c; m.l2 = base + 4; m.c2 = CANVAS; m.c3 = s.c; m.icon = ICON[e.type][0];
      }
      if (e.stale) { m.c3 = '#4A5A72'; }
      return m;
    });
    var rows = events.filter(function (e) { return !e.hideRow; }).map(function (e) {
      var s = SEV[e.sev];
      var fc = e.kind === 'forecast';
      return { title: e.title, meta: e.meta, sev: s.word, srcSev: e.src, color: e.stale ? '#9AABC2' : s.c, clip: s.clip,
        c1: e.stale ? '#4A5A72' : s.c, c2: fc ? CANVAS : (e.stale ? '#4A5A72' : s.c), inset: fc ? 3 : 0,
        icon: ICON[e.type][fc ? 1 : 0], iconTop: s.dy ? 60 : 50, kind: e.kind === 'observed' ? 'Observed' : (fc ? 'Forecast' : 'Official warning'),
        kindBorder: fc ? 'dashed' : 'solid', freshColor: e.stale ? '#FFB54A' : '#9AABC2', opacity: e.stale ? 0.8 : 1,
        aria: s.word + ' ' + e.title + ', ' + e.kind + ', ' + e.meta };
    });
    var self = this;
    var medium = this.state.detent === 'medium';
    return {
      markers: markers,
      rows: rows,
      clusters: [
        { x: 318, y: 238, count: 3, color: '#FFB54A', aria: 'Cluster, 3 events, highest severity moderate' },
        { x: 332, y: 350, count: 6, color: '#FFB54A', aria: 'Cluster, 6 events, highest severity moderate' }
      ],
      chips: [
        { label: 'All types', border: '#24324A', bg: 'rgba(17,28,45,0.78)', fg: '#E8EEF6' },
        { label: 'Severity ≥ Minor', border: '#24324A', bg: 'rgba(17,28,45,0.78)', fg: '#E8EEF6' },
        { label: 'Last 24 h', border: 'rgba(82,182,255,0.5)', bg: 'rgba(82,182,255,0.14)', fg: '#52B6FF' },
        { label: '3 of 4 kinds', border: '#24324A', bg: 'rgba(17,28,45,0.78)', fg: '#E8EEF6' }
      ],
      stats: [
        { value: '2,481', label: 'Observed events', color: '#E8EEF6' },
        { value: '37', label: 'High severity', color: '#FF8540' },
        { value: '12', label: 'Official warnings', color: '#E8EEF6' }
      ],
      sheetTop: medium ? 470 : 640,
      detentLabel: medium ? 'Collapse sheet' : 'Expand sheet',
      toggleDetent: function () { self.setState({ detent: medium ? 'peek' : 'medium' }); },
      showToast: this.state.toast,
      dismissToast: function () { self.setState({ toast: false }); }
    };
  }
}
</script>
</body>
</html>

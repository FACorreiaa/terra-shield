openapi: 3.1.0
info:
  title: Shield API
  version: 1.0.0-draft
  description: >
    Global natural-hazard events, normalized from official and scientific
    sources. Every record carries its source, its source's own severity next
    to Shield's derived severity, and freshness timestamps. Shield does not
    replace national emergency services.

    Limits on every /v1 operation: 20 requests per second per client IP,
    with bursts of 40 (429 with `Retry-After` beyond that); 10 s per request,
    except `/v1/stream` (503 when exceeded); at most 8 open streams per IP.
    Responses over 1 KB are gzip-compressed when the client accepts it,
    except the stream.
servers:
  - url: http://localhost:8080
# Public and read-only in the MVP: no accounts (auth is Phase 3).
security: []
paths:
  /health/live:
    get:
      operationId: getLive
      summary: Liveness probe.
      tags: [ops]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
  /health/ready:
    get:
      operationId: getReady
      summary: Readiness probe (database reachable).
      tags: [ops]
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: A dependency is unhealthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics.
      tags: [ops]
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain: {}
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: This OpenAPI document.
      tags: [ops]
      responses:
        "200":
          description: This document.
          content:
            application/yaml: {}
  /v1/sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: Every feed Shield ingests, with license, attribution and freshness.
      responses:
        "200":
          description: Sources, ordered by id.
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: { $ref: "#/components/schemas/Source" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default:
          $ref: "#/components/responses/Error"
  /v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Events in a map view, filtered; clustered at low zoom.
      description: >
        Returns active events by default. With `zoom` below 6, events that
        would overlap on screen are merged into `clusters` (ADR 9); without
        `zoom`, nothing is clustered. Results are ordered by severity
        (extreme first), then `updatedAt` (newest first), and capped at
        `limit`; `truncated` says when more matched. With `near`, only
        events within `radiusKm` of the point are returned, nearest first,
        each with `distanceKm`; `near` cannot be combined with `zoom` below
        6. Clients should round the point to two decimals (about 1 km): it
        is a query parameter, so proxies may log it. Send
        `Accept: application/geo+json` for a GeoJSON FeatureCollection with
        each event's geometry, simplified for `zoom`. Negotiation follows
        q-values; plain JSON wins a tie, `*/*` and a missing Accept, so a
        client listing both types with equal weight gets JSON.
      parameters:
        - $ref: "#/components/parameters/BBox"
        - $ref: "#/components/parameters/Zoom"
        - $ref: "#/components/parameters/Category"
        - { name: type, in: query, description: "Comma-separated event types. With neither type nor category, every hazard type: conflicts only when named (ADR 27). With both, the types in both.", schema: { type: string }, examples: { quakes: { value: "earthquake,tsunami" } } }
        - { name: severity, in: query, description: "Comma-separated severities.", schema: { type: string }, examples: { serious: { value: "severe,extreme" } } }
        - { name: kind, in: query, description: "Comma-separated kinds.", schema: { type: string } }
        - { name: status, in: query, description: "Comma-separated statuses (active, resolved). Defaults to active; `active,resolved` includes both.", schema: { type: string }, examples: { both: { value: "active,resolved" } } }
        - { name: source, in: query, description: "Comma-separated source ids.", schema: { type: string } }
        - { name: country, in: query, description: "ISO 3166-1 alpha-2; matches events within the country or nearby offshore.", schema: { type: string, pattern: "^[A-Z]{2}$" } }
        - { name: near, in: query, description: "lon,lat in WGS 84 (the order of bbox): only events within radiusKm of this point, nearest first, each with distanceKm. Round to two decimals.", schema: { type: string }, examples: { lisbon: { value: "-9.14,38.72" } } }
        - { name: radiusKm, in: query, description: "Radius for near, in km. Requires near.", schema: { type: number, minimum: 1, maximum: 1000, default: 100 } }
        - { name: since, in: query, description: "Only events that last mattered at or after this time: the last update for an active event, the end (`endedAt`, else the last update) for a resolved one.", schema: { type: string, format: date-time } }
        - { name: until, in: query, description: "Only events that last mattered before this time, by the same rule as `since`.", schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
      responses:
        "200":
          description: Matching events.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventList" }
            application/geo+json:
              schema: { $ref: "#/components/schemas/EventFeatureCollection" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Error" }
  /v1/events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: One event with its full geometry, source and change history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The event.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventDetail" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Error" }
  /v1/countries:
    get:
      operationId: listCountries
      tags: [countries]
      summary: Every country with its count of active hazards (conflicts not counted, ADR 27).
      responses:
        "200":
          description: Countries, ordered by name.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [countries]
                properties:
                  countries:
                    type: array
                    items: { $ref: "#/components/schemas/Country" }
        "304": { $ref: "#/components/responses/NotModified" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Error" }
  /v1/countries/{iso2}/summary:
    get:
      operationId: getCountrySummary
      tags: [countries]
      summary: What is happening in one country, how serious, and how well it is covered.
      description: Counts, events and recent changes cover hazards; conflicts are not included (ADR 27).
      parameters:
        - { name: iso2, in: path, required: true, schema: { type: string, pattern: "^[A-Z]{2}$" } }
      responses:
        "200":
          description: The summary.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CountrySummary" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Error" }
  /v1/fires:
    get:
      operationId: listFires
      tags: [fires]
      summary: Satellite fire detections (NASA FIRMS), a separate layer from events (ADR 10).
      description: >
        Detections are thermal anomalies, not confirmed wildfires. Without
        `zoom` or below 6, detections are aggregated into grid cells for a
        heatmap (`FireCell` features, cell size 360/2^(zoom+5) degrees, about
        8 px); from zoom 6, each detection is a point (`FireDetection`
        features), `bbox` is required, and at most 25,000 points are
        returned, newest first (`truncated` says when more matched).
        Detections arrive about 3 h after the satellite pass. Cached for
        60 s: FIRMS updates every 15 min at most.
      parameters:
        - $ref: "#/components/parameters/BBox"
        - $ref: "#/components/parameters/Zoom"
        - { name: since, in: query, description: "Only detections acquired at or after this time; defaults to 24 h ago. Earlier values are clamped to 48 h ago, the retention window.", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Detections or cells.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/FireFeatureCollection" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Error" }
  /v1/aircraft:
    get:
      operationId: listAircraft
      tags: [aircraft]
      summary: Live aircraft positions in a map view (adsb.lol), a separate layer from events.
      description: >
        Positions are cached in memory and never stored. The world is cut
        into 5° cells (on multiples of 5°); `bbox` is required and may span
        at most 4 of them, else 400 ("zoom in"): a view up to 5° high and 5°
        wide always fits, up to 10° × 10° fits when aligned. Each cell is
        refreshed from the feed at most once a minute, and only while its
        daily quota allows. Without a key (500 requests a day) the whole
        server gets one request every ~3 minutes, so one viewer's 4-cell
        view is up to 12 minutes old: show `dataAt`, and poll no faster than
        once a minute. A cell with no data younger than 15 minutes is left
        out and `complete` is false. Aircraft whose operators opted out of display (FAA LADD,
        privacy ICAO addresses) are never returned. Military aircraft are
        returned as the feed reports them, with `military` set. Data ODbL
        1.0: show `attribution` on the map.
      parameters:
        - $ref: "#/components/parameters/BBox"
      responses:
        "200":
          description: Aircraft in the view.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AircraftList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Error" }
  /v1/bases:
    get:
      operationId: listBases
      tags: [bases]
      summary: Military installations listed on Wikidata, a static layer separate from events.
      description: >
        Installations with coordinates and no recorded closure, refreshed
        weekly from Wikidata (CC0). Wikidata records closures unevenly, so
        a listing is not proof a base is in use: show `note`, and link each
        base to its Wikidata item (`url`). Items with an end or closure
        date, a closed state of use, or a description saying former or
        historic are left out, as are unnamed items and barracks.
        Worldwide without `bbox` (a few thousand points); cached for an
        hour.
      parameters:
        - $ref: "#/components/parameters/BBox"
      responses:
        "200":
          description: Bases in the view, or all of them.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaseList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Unavailable" }
        default: { $ref: "#/components/responses/Error" }
  /v1/stream:
    get:
      operationId: streamEvents
      tags: [events]
      summary: Live event changes as Server-Sent Events (ADR 16).
      description: >
        Server-Sent Events. Each connection first sends `retry: 5000`, then,
        when `Last-Event-ID` is given, the changes missed since that cursor;
        if the cursor is more than 1,000 changes behind, older than the
        retained change log (7 days), or unknown, it sends
        `event: reset` instead and the client reloads `/v1/events`. Then
        `event: ready`, whose `id` is the cursor the stream continues from.
        Live messages are `event.created`, `event.updated` and
        `event.resolved` (`data`: one `Event`, as in `/v1/events`, without
        geometry) and `event.removed` (`data`: `{"id": "..."}`; the source
        retracted it, or retention deleted it 90 days after it ended). Changes are coalesced: after a reconnect, an event
        changed twice is sent once, in its latest state, so clients treat
        created and updated alike as an upsert. Every 20 s an `id`-only line
        (no event is dispatched) is the heartbeat; it also moves
        Last-Event-ID past changes the filters skipped. Filters work as in
        `/v1/events`; `bbox` matches an event's bounding box, and removals
        are always sent. Open the stream first, then load `/v1/events`, so
        no change falls between the two.
      parameters:
        - $ref: "#/components/parameters/BBox"
        - $ref: "#/components/parameters/Category"
        - { name: type, in: query, description: "Comma-separated event types; as on /v1/events, hazards only unless conflict is named.", schema: { type: string } }
        - { name: severity, in: query, description: "Comma-separated severities.", schema: { type: string } }
        - { name: country, in: query, schema: { type: string, pattern: "^[A-Z]{2}$" } }
        - { name: Last-Event-ID, in: header, description: "The last `id` received; EventSource sends it on reconnect.", schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: lastEventId, in: query, description: "Same as the Last-Event-ID header, for a first connection that cannot set headers.", schema: { type: string, pattern: "^[0-9]+$" } }
      responses:
        "200":
          description: An endless event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503":
          description: The pod is at its connection limit, or shutting down; retry after `Retry-After` seconds. Too many streams from one IP is a 429.
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
components:
  parameters:
    Category:
      name: category
      in: query
      description: >
        Comma-separated categories (menus), each standing for its types (see
        Category). `category=conflicts` is how conflicts are asked for.
      schema: { type: string }
      examples:
        weather: { value: "weather" }
        conflicts: { value: "conflicts" }
    BBox:
      name: bbox
      in: query
      description: >
        minLon,minLat,maxLon,maxLat in WGS 84. minLon greater than maxLon
        crosses the antimeridian.
      schema: { type: string }
      examples:
        europe: { value: "-25,34,45,72" }
    Zoom:
      name: zoom
      in: query
      description: Map zoom level; drives clustering and geometry simplification.
      schema: { type: integer, minimum: 0, maximum: 22 }
  headers:
    ETag:
      description: Strong validator; send it back as If-None-Match.
      schema: { type: string }
    CacheControl:
      description: "public, max-age=15 (ADR 16: below the shortest poll interval)."
      schema: { type: string }
  responses:
    NotModified:
      description: Unchanged since the ETag sent in If-None-Match.
    BadRequest:
      description: A parameter is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded (code `rate_limited`); retry after `Retry-After` seconds.
      headers:
        Retry-After: { description: Seconds to wait., schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The request took longer than 10 s, or the database is unreachable (code `unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error, code, reason]
      properties:
        error: { type: boolean }
        code: { type: string }
        reason: { type: string }
        requestId: { type: string }
    Readiness:
      type: object
      required: [status, checks, version]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        version: { type: string }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [healthy, unhealthy] }
              message: { type: string }
    Source:
      type: object
      required: [id, name, url, license, attribution, pollIntervalSeconds, enabled]
      properties:
        id: { type: string, examples: [usgs] }
        name: { type: string }
        url: { type: string, format: uri }
        license: { type: string }
        attribution: { type: string }
        pollIntervalSeconds: { type: integer }
        enabled: { type: boolean }
        coverage:
          type: string
          description: >
            One line on what the source covers, for the Sources screen
            ("Earthquakes of magnitude 2.5 and above, worldwide"). Free
            text; unrelated to a country summary's coverage object.
          examples: ["Official weather warnings, 38 European countries"]
        termsUrl:
          type: string
          format: uri
          description: The source's licence or terms page. Absent when not verified.
        cadence:
          type: string
          description: >
            How often the source itself publishes ("monthly release"), as
            opposed to pollIntervalSeconds, how often Shield checks it.
          examples: [monthly release]
        onDemand:
          type: boolean
          description: >
            True for a source Shield fetches only while someone views its
            layer (live flights), not on a schedule: pollIntervalSeconds is
            then the fastest refresh, and the source is never stale.
        lastSuccessAt: { type: string, format: date-time }
        lastErrorAt: { type: string, format: date-time }
        stale:
          type: boolean
          description: True when the last success is older than three poll intervals. Always false for an on-demand source.
    OpenEventType:
      description: >
        An EventType, or a type added after this client was built: treat
        unknown values as "other". New types are added without a new API
        version (ADR 18).
      anyOf:
        - $ref: "#/components/schemas/EventType"
        - type: string
    EventType:
      type: string
      description: >
        What happened. `conflict` is an armed-conflict event (UCDP, ADR 27),
        not a hazard: list, stream and country endpoints leave conflicts out
        unless `type` or `category` names them.
      enum: [earthquake, wildfire, flood, storm, tropical_cyclone, volcano, drought, heat, cold, heavy_rain, wind, snow_ice, tsunami, other, conflict]
    OpenCategory:
      description: A Category, or one added after this client was built; treat unknown values as "other".
      anyOf:
        - $ref: "#/components/schemas/Category"
        - type: string
    Category:
      type: string
      description: >
        The map's menus, in menu order. quakes: earthquake, tsunami.
        weather: storm, tropical_cyclone, heavy_rain, wind, snow_ice, heat,
        cold, drought. floods: flood. fires: wildfire. volcanoes: volcano.
        conflicts: conflict. other: other.
      enum: [quakes, weather, floods, fires, volcanoes, conflicts, other]
    EventKind:
      type: string
      description: What kind of statement the record is (ADR 3). A detection is never a confirmed event.
      enum: [observed, warning, forecast, detection]
    EventStatus:
      type: string
      enum: [active, resolved]
    Severity:
      type: string
      description: Shield's CAP-aligned severity, derived per source (ADR 2, docs/severity.md).
      enum: [minor, moderate, severe, extreme]
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
    EventCountry:
      type: object
      required: [iso2, relation]
      properties:
        iso2: { type: string, pattern: "^[A-Z]{2}$" }
        relation:
          type: string
          enum: [within, nearby]
          description: >
            within: the event's geometry intersects the country. nearby: the
            event is offshore, within 250 km; never say "in" for it (ADR 4).
        distanceKm:
          type: number
          format: double
          description: Present for nearby; distance from the event to the coast.
    Event:
      type: object
      required: [id, source, type, kind, status, severity, title, centroid, countries, observedAt, updatedAt, fetchedAt, attrs]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, description: "Source id, as in /v1/sources.", examples: [usgs] }
        type: { $ref: "#/components/schemas/OpenEventType" }
        category:
          $ref: "#/components/schemas/OpenCategory"
          description: The map menu this event belongs to. Always sent by this server; optional only so older fixtures decode.
        kind: { $ref: "#/components/schemas/EventKind" }
        status: { $ref: "#/components/schemas/EventStatus" }
        severity: { $ref: "#/components/schemas/Severity" }
        sourceSeverity:
          type: string
          description: The source's own severity, verbatim ("M 6.1 mww, PAGER yellow", "Orange warning", "2,379 acres burned").
        severityProvisional:
          type: boolean
          description: >
            True when severity is derived from a weak signal (every EONET
            event: burned area, or no scale at all). Omitted means false.
        title: { type: string }
        summary: { type: string }
        centroid: { $ref: "#/components/schemas/Coordinate" }
        countries:
          type: array
          items: { $ref: "#/components/schemas/EventCountry" }
        startedAt: { type: string, format: date-time }
        observedAt: { type: string, format: date-time, description: "When the source last observed or issued it." }
        updatedAt: { type: string, format: date-time, description: "When the source last changed it." }
        endedAt: { type: string, format: date-time }
        fetchedAt: { type: string, format: date-time, description: "When Shield last fetched it." }
        url: { type: string, format: uri, description: "The official source page." }
        attrs:
          type: object
          additionalProperties: true
          description: Type- and source-specific attributes, documented in docs/attrs.md.
        distanceKm:
          type: number
          format: double
          minimum: 0
          description: >
            Only on a `near` query: distance in km from the point to the
            event's geometry, to 0.1 km; 0 when the point is inside a warning
            area or footprint.
    Cluster:
      type: object
      required: [centroid, count, maxSeverity, types, severities, statuses, activeSeverities, bbox]
      properties:
        centroid: { $ref: "#/components/schemas/Coordinate" }
        count: { type: integer, minimum: 2 }
        maxSeverity: { $ref: "#/components/schemas/Severity" }
        types:
          type: object
          description: Count per event type; types with no members are omitted.
          additionalProperties: { type: integer }
        severities:
          type: object
          description: >
            Count per severity (minor, moderate, severe, extreme); severities
            with no members are omitted. The counts add up to `count`.
          additionalProperties: { type: integer }
        statuses:
          type: object
          description: >
            Count per status (active, resolved); statuses with no members are
            omitted. The counts add up to `count`. `maxSeverity` and
            `severities` cover every member, resolved ones included.
          additionalProperties: { type: integer }
        activeSeverities:
          type: object
          description: >
            Count per severity among active members only; empty when none is
            active. Lets a view that includes resolved events say how many
            ongoing events are serious.
          additionalProperties: { type: integer }
        bbox:
          type: array
          description: minLon, minLat, maxLon, maxLat; zoom here to split the cluster.
          items: { type: number, format: double }
          minItems: 4
          maxItems: 4
    EventList:
      type: object
      required: [events, clusters, truncated, generatedAt]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        clusters:
          type: array
          items: { $ref: "#/components/schemas/Cluster" }
        truncated: { type: boolean, description: "More events matched than limit." }
        generatedAt: { type: string, format: date-time }
    Geometry:
      type: object
      description: A GeoJSON geometry (RFC 7946), WGS 84, longitude first.
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon] }
        coordinates: {}
    EventFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        id: { type: string, format: uuid }
        geometry: { $ref: "#/components/schemas/Geometry" }
        properties: { $ref: "#/components/schemas/Event" }
    EventFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, enum: [FeatureCollection] }
        features:
          type: array
          items: { $ref: "#/components/schemas/EventFeature" }
        truncated: { type: boolean }
    Revision:
      type: object
      required: [at, changes]
      properties:
        at: { type: string, format: date-time }
        changes:
          type: object
          description: 'Changed fields, each as {"from": ..., "to": ...}; geometry changes are flagged, not inlined.'
          additionalProperties: true
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/Event"
        - type: object
          required: [geometry, sourceInfo, revisions]
          properties:
            geometry: { $ref: "#/components/schemas/Geometry" }
            sourceInfo: { $ref: "#/components/schemas/Source" }
            revisions:
              type: array
              description: Newest first, at most 50.
              items: { $ref: "#/components/schemas/Revision" }
    Country:
      type: object
      required: [iso2, iso3, name, activeEvents, bbox]
      properties:
        iso2: { type: string, pattern: "^[A-Z]{2}$" }
        iso3: { type: string, pattern: "^[A-Z]{3}$" }
        name: { type: string }
        activeEvents: { type: integer, minimum: 0 }
        maxSeverity:
          $ref: "#/components/schemas/Severity"
          description: Highest severity among active events; absent when there are none.
        bbox:
          type: array
          items: { type: number, format: double }
          minItems: 4
          maxItems: 4
    SeverityCount:
      type: object
      required: [type, severity, count]
      properties:
        type: { $ref: "#/components/schemas/OpenEventType" }
        severity: { $ref: "#/components/schemas/Severity" }
        count: { type: integer, minimum: 1 }
    Coverage:
      type: object
      required: [officialWarnings, sources]
      properties:
        officialWarnings:
          type: boolean
          description: >
            False when no official national warning feed covers the country.
            The UI then says coverage is limited: absence of data is not
            safety (ADR 7).
        sources:
          type: array
          description: Ids of the sources that cover the country.
          items: { type: string }
    CountrySummary:
      type: object
      required: [country, counts, coverage, events, recentChanges, generatedAt]
      properties:
        country: { $ref: "#/components/schemas/Country" }
        counts:
          type: array
          description: Active events by type and severity; zero cells are omitted.
          items: { $ref: "#/components/schemas/SeverityCount" }
        coverage: { $ref: "#/components/schemas/Coverage" }
        events:
          type: array
          description: Active events, most severe first, at most 100.
          items: { $ref: "#/components/schemas/Event" }
        recentChanges:
          type: array
          description: Revisions of this country's events in the last 24 h, newest first, at most 50.
          items:
            type: object
            required: [eventId, title, at, changes]
            properties:
              eventId: { type: string, format: uuid }
              title: { type: string }
              at: { type: string, format: date-time }
              changes: { type: object, additionalProperties: true }
        generatedAt: { type: string, format: date-time }
    FireDetection:
      type: object
      description: One VIIRS detection (zoom 6 and above).
      required: [satellite, acquiredAt]
      properties:
        satellite: { type: string, examples: [NOAA-20] }
        acquiredAt: { type: string, format: date-time }
        frp: { type: number, format: float, description: "Fire radiative power, MW." }
        confidence: { type: string, enum: [low, nominal, high] }
        iso2: { type: string, pattern: "^[A-Z]{2}$" }
    FireCell:
      type: object
      description: Detections aggregated into one grid cell (zoom below 6).
      required: [count, latestAt]
      properties:
        count: { type: integer, minimum: 1 }
        maxFrp: { type: number, format: float }
        latestAt: { type: string, format: date-time }
    FireFeature:
      type: object
      required: [type, geometry, properties]
      properties:
        type: { type: string, enum: [Feature] }
        geometry: { $ref: "#/components/schemas/Geometry" }
        properties:
          description: A FireDetection, or a FireCell when the collection's aggregation is "grid".
          anyOf:
            - $ref: "#/components/schemas/FireDetection"
            - $ref: "#/components/schemas/FireCell"
    BaseList:
      type: object
      required: [bases, attribution, license, note]
      properties:
        bases:
          type: array
          items: { $ref: "#/components/schemas/MilitaryBase" }
        updatedAt: { type: string, format: date-time, description: "When Shield last refreshed the layer from Wikidata. Absent when empty." }
        attribution: { type: string, examples: [Wikidata] }
        license: { type: string, examples: [CC0 1.0] }
        note: { type: string, description: "What a listing means; show it with the layer." }
    MilitaryBase:
      type: object
      required: [id, name, kind, class, lon, lat, url]
      properties:
        id: { type: string, description: "Wikidata item ID.", examples: [Q161348] }
        name: { type: string, examples: [Ramstein Air Base] }
        description: { type: string, description: "Wikidata's English description." }
        kind:
          description: "Glyph group. Treat unknown values as base."
          anyOf:
            - { type: string, enum: [air, naval, missile, radar, base] }
            - { type: string }
        class: { type: string, description: "Wikidata class in English.", examples: [air base] }
        operator: { type: string, description: "Who runs it (Wikidata P137), when listed.", examples: [United States Air Force] }
        country: { type: string, description: "ISO 3166-1 alpha-2 where it sits; absent at sea or when unknown.", examples: [DE] }
        lon: { type: number, format: double }
        lat: { type: number, format: double }
        url: { type: string, format: uri, description: "The Wikidata item." }
    AircraftList:
      type: object
      required: [aircraft, complete, attribution, license, licenseUrl]
      properties:
        aircraft:
          type: array
          items: { $ref: "#/components/schemas/Aircraft" }
        dataAt:
          type: string
          format: date-time
          description: When the feed generated the oldest data in this answer. Absent when nothing was served.
        complete:
          type: boolean
          description: False when part of the view had no data young enough to serve (the feed's quota is spent or it failed).
        attribution: { type: string, examples: ["© adsb.lol contributors"] }
        license: { type: string, examples: [ODbL 1.0] }
        licenseUrl: { type: string, format: uri }
    Aircraft:
      type: object
      required: [hex, lon, lat, onGround, military, positionAt]
      properties:
        hex: { type: string, description: "24-bit ICAO address in lowercase hex; a leading \"~\" marks a non-ICAO address.", examples: ["49530a"] }
        callsign: { type: string, examples: [TAP215] }
        registration: { type: string, examples: [CS-TXK] }
        typeCode: { type: string, description: "ICAO aircraft type designator.", examples: [A21N] }
        lon: { type: number, format: double }
        lat: { type: number, format: double }
        altitudeFt: { type: integer, description: "Barometric altitude in feet. Absent on the ground or when not reported." }
        onGround: { type: boolean }
        groundSpeedKt: { type: number, format: double }
        trackDeg: { type: number, format: double, description: "True track over ground, 0–360." }
        verticalRateFpm: { type: integer }
        squawk: { type: string, examples: ["7700"] }
        emergency: { type: string, description: "ADS-B emergency status (general, lifeguard, minfuel, nordo, unlawful, downed, reserved). Absent when none." }
        military: { type: boolean, description: "The feed database's military flag." }
        positionAt: { type: string, format: date-time, description: "When this position was received; at most 60 s before the feed's answer." }
    FireFeatureCollection:
      type: object
      required: [type, aggregation, features, truncated]
      properties:
        type: { type: string, enum: [FeatureCollection] }
        aggregation:
          type: string
          enum: [none, grid]
          description: grid when features are FireCells.
        cellDegrees: { type: number, format: double, description: "Grid cell size, when aggregation is grid." }
        features:
          type: array
          items: { $ref: "#/components/schemas/FireFeature" }
        truncated: { type: boolean, description: "More detections matched than were returned (points only)." }
